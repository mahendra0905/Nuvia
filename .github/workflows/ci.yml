# Continuous integration for Nuvia — pull requests and branch pushes.
#
# SCOPE (Phase 8, part 1): build and test ONLY. This workflow deliberately has NO access to
# production credentials, NO Telegram login, and performs NO network upload tests. It must be
# safe to run on untrusted pull-request code, so it holds no secrets and requests the minimum
# permissions. Release packaging and credential injection live in a SEPARATE, trusted workflow
# (release.yml) that is gated on a protected environment and never triggered by pull requests.
#
# WPF is Windows-only, so this runs on windows-latest. A green run here proves the code compiles
# and the network-free unit tests pass. It does NOT prove the WPF UI works, that the installer
# builds, or that any Windows UX is correct — those remain manual (see docs/CI_RELEASE.md).
#
# Third-party actions are pinned to a full commit SHA (not a moving tag) so a compromised or
# retagged release cannot silently change what runs. The version each SHA is expected to match is
# noted in a trailing comment; verify these before trusting (see docs/CI_RELEASE.md).

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Least privilege: this workflow only needs to read the repository contents.
permissions:
  contents: read

# Cancel superseded runs on the same ref to save runner time.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & test (Release)
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up .NET 8 SDK
        uses: actions/setup-dotnet@87b7050bc53ea08284295505d98d2aa94301e852 # v4.0.1
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore Nuvia.sln

      - name: Build (Release, no restore)
        run: dotnet build Nuvia.sln -c Release --no-restore

      # Runs the network-free unit tests only (tests/Nuvia.Tests). There is no account login and
      # no upload test here by design: nothing in this workflow may require credentials.
      - name: Test (Release, no build)
        run: dotnet test Nuvia.sln -c Release --no-build --verbosity normal
